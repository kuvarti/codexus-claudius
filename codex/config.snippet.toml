# Managed Codex values. The installer substitutes the absolute notify script
# path and applies only the components selected by the user.
notify = ["bash", "__NOTIFY_SCRIPT__"]

[tui]
notifications = ["agent-turn-complete", "approval-requested"]
notification_condition = "unfocused"
status_line = ["model-with-reasoning", "context-remaining", "git-branch", "current-dir"]
